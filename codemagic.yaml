workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter project
        script: flutter create --org com.tapmine --project-name tapmine .
      - name: Add packages
        script: flutter pub add shared_preferences
      - name: Set app name
        script: |
          perl -pi -e 's/android:label="[^"]*"/android:label="TapMine Rewards"/' android/app/src/main/AndroidManifest.xml
      - name: Copy app code
        script: cp app_src/main.dart lib/main.dart
      - name: Build APK
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/**/outputs/**/*.apk
